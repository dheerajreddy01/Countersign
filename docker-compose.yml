name: countersign

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-countersign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-countersign}
      POSTGRES_DB: ${POSTGRES_DB:-countersign}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-countersign}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./infra/redpanda/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      RPK_BROKERS: redpanda:9092

  gateway:
    build: ./services/gateway
    env_file: [.env]
    environment:
      REDPANDA_PROXY_URL: http://redpanda:8082
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  normalizer:
    build:
      context: ./services/pipeline
      args:
        CMD: normalizer
    env_file: [.env]
    environment:
      REDPANDA_PROXY_URL: http://redpanda:8082
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  caseservice:
    build:
      context: ./services/pipeline
      args:
        CMD: caseservice
    env_file: [.env]
    environment:
      REDPANDA_PROXY_URL: http://redpanda:8082
      CASE_SERVICE_ADDR: ":8081"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"

  mandate:
    build:
      context: ./services/pipeline
      args:
        CMD: mandate
    env_file: [.env]
    environment:
      MANDATE_SERVICE_ADDR: ":8082"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8082"

  ai:
    build: ./services/ai
    env_file: [.env]
    ports:
      - "8000:8000"

  web:
    build: ./web
    environment:
      # Proxy the score endpoint to the AI service on the compose network.
      AI_SERVICE_URL: http://ai:8000
      # Unset: the console serves its built-in demo fixtures.
      CONSOLE_API_URL: ""
    depends_on:
      - ai
    ports:
      - "3000:3000"

volumes:
  pgdata:
