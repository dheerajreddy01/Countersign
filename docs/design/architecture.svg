<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1276 590" width="1276" height="590" role="img" aria-labelledby="title desc">
  <title id="title">How a dispute moves through Countersign</title>
  <desc id="desc">PayPal's dispute webhook reaches the gateway, then Redpanda, then the normalizer, case service and evidence builder, which share one Render instance with the executor. The evidence builder calls the AI service for a score and draft and saves them on the case. The merchant console, behind a sign-in page, reads cases from the case service and posts approved actions to it; the case service hands them to the executor over the bus, the executor calls the PayPal Disputes API, and the outcome comes back to the case service over the bus.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8fa8"/>
    </marker>
    <style>
      .bg { fill: #161a27; }
      .box { fill: #1c2032; stroke: #3a3f56; stroke-width: 1.5; }
      .hi { fill: #20234a; stroke: #7c6ff0; stroke-width: 1.8; }
      .ext { fill: none; stroke: #4a4f66; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .group { fill: none; stroke: #6a5ee0; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .t { font: 700 17px Inter, "Segoe UI", system-ui, sans-serif; fill: #f1f2f8; text-anchor: middle; }
      .s { font: 400 12.5px Inter, "Segoe UI", system-ui, sans-serif; fill: #b9bcd2; text-anchor: middle; }
      .lbl { font: 400 11.5px Inter, "Segoe UI", system-ui, sans-serif; fill: #9a9eb6; }
      .grp { font: 700 11.5px ui-monospace, "SF Mono", Menlo, monospace; fill: #8b7cf6; letter-spacing: 1.2px; }
      .h1 { font: 800 38px Inter, "Segoe UI", system-ui, sans-serif; fill: #f1f2f8; }
      .foot { font: 400 11.5px Inter, "Segoe UI", system-ui, sans-serif; fill: #8a8fa8; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      .line { fill: none; stroke: #8a8fa8; stroke-width: 1.8; }
      .dash { fill: none; stroke: #8a8fa8; stroke-width: 1.4; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect class="bg" width="1276" height="590"/>
  <text class="h1" x="64" y="46">How a dispute moves through Countersign</text>

  <!-- one Render instance: normalizer, case service, evidence builder, executor -->
  <rect class="group" x="561" y="107" width="478" height="268" rx="12"/>
  <text class="grp" x="575" y="127">ONE RENDER INSTANCE (cmd/spine)</text>

  <!-- top row: the inbound path -->
  <rect class="ext" x="75" y="141" width="136" height="82" rx="10"/>
  <text class="t" x="143" y="176">PayPal</text>
  <text class="s" x="143" y="196">dispute webhook</text>

  <rect class="hi" x="241" y="141" width="136" height="82" rx="10"/>
  <text class="t" x="309" y="171">Gateway</text>
  <text class="s" x="309" y="191">Go · verify signature</text>
  <text class="s" x="309" y="208">dedupe</text>

  <rect class="box" x="407" y="141" width="136" height="82" rx="10"/>
  <text class="t" x="475" y="171">Redpanda</text>
  <text class="s" x="475" y="191">Kafka-compatible</text>
  <text class="s" x="475" y="208">event bus</text>

  <rect class="box" x="573" y="141" width="136" height="82" rx="10"/>
  <text class="t" x="641" y="176">Normalizer</text>
  <text class="s" x="641" y="196">PayPal → dispute</text>

  <rect class="box" x="729" y="141" width="136" height="82" rx="10"/>
  <text class="t" x="797" y="171">Case service</text>
  <text class="s" x="797" y="191">writes the case</text>
  <text class="s" x="797" y="208">console API</text>

  <rect class="box" x="885" y="141" width="143" height="82" rx="10"/>
  <text class="t" x="956" y="171">Evidence</text>
  <text class="t" x="956" y="190">builder</text>
  <text class="s" x="956" y="210">assembles bundle</text>

  <rect class="hi" x="1061" y="141" width="146" height="82" rx="10"/>
  <text class="t" x="1134" y="167">AI service</text>
  <text class="s" x="1134" y="186">Python · score + EV</text>
  <text class="s" x="1134" y="201">LLM draft +</text>
  <text class="s" x="1134" y="216">grounding guard</text>

  <path class="line" d="M211 182 H238" marker-end="url(#arrow)"/>
  <path class="line" d="M377 182 H404" marker-end="url(#arrow)"/>
  <path class="line" d="M543 182 H570" marker-end="url(#arrow)"/>
  <path class="line" d="M709 182 H726" marker-end="url(#arrow)"/>
  <path class="line" d="M865 182 H882" marker-end="url(#arrow)"/>

  <!-- evidence builder calls the AI service and keeps the answer -->
  <path class="line" d="M1028 170 H1058" marker-end="url(#arrow)"/>
  <path class="line" d="M1061 196 H1031" marker-end="url(#arrow)"/>
  <text class="lbl" x="1134" y="243" text-anchor="middle">score + draft, saved on the case</text>

  <!-- inside the instance: case service hands actions to the executor -->
  <rect class="box" x="573" y="279" width="120" height="82" rx="10"/>
  <text class="t" x="633" y="311">Executor</text>
  <text class="s" x="633" y="331">carries out</text>
  <text class="s" x="633" y="347">the action</text>

  <path class="line" d="M750 223 V296 H696" marker-end="url(#arrow)"/>
  <text class="lbl" x="701" y="289">action</text>
  <path class="dash" d="M693 340 H772 V226" marker-end="url(#arrow)"/>
  <text class="lbl" x="701" y="356">outcome</text>

  <!-- executor out to PayPal -->
  <rect class="ext" x="75" y="279" width="185" height="82" rx="10"/>
  <text class="t" x="167" y="312">PayPal Disputes API</text>
  <text class="s" x="167" y="333">evidence · offer · accept</text>
  <path class="line" d="M573 320 H263" marker-end="url(#arrow)"/>

  <!-- mandates -->
  <rect class="hi" x="1061" y="279" width="146" height="82" rx="10"/>
  <text class="t" x="1134" y="311">Mandate ledger</text>
  <text class="s" x="1134" y="331">signed · hash-chained</text>
  <path class="dash" d="M1061 320 H990 V226" marker-end="url(#arrow)"/>
  <text class="lbl" x="982" y="300" text-anchor="end">mandate lookup</text>

  <rect class="ext" x="1061" y="415" width="146" height="81" rx="10"/>
  <text class="t" x="1134" y="449">AI agent</text>
  <text class="s" x="1134" y="469">signs mandate</text>
  <path class="dash" d="M1134 415 V364" marker-end="url(#arrow)"/>

  <!-- storage -->
  <rect class="box" x="573" y="415" width="136" height="81" rx="10"/>
  <text class="t" x="641" y="443">Postgres</text>
  <text class="s" x="641" y="463">every case, decision,</text>
  <text class="s" x="641" y="479">draft and outcome</text>
  <path class="dash" d="M641 375 V415"/>

  <!-- the console talks only to the case service -->
  <rect class="hi" x="729" y="415" width="300" height="81" rx="10"/>
  <text class="t" x="879" y="447">Merchant console</text>
  <text class="s" x="879" y="468">Next.js · review, approve</text>
  <text class="s" x="879" y="485"><tspan font-weight="600" style="fill:#a99cff">sign-in page</tspan> · signed session cookie</text>
  <path class="line" d="M830 412 V226" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="838" y="400">reads cases · posts approved actions</text>

  <text class="foot" x="75" y="540">Dashed boxes are outside Countersign. Every hop on the bus is idempotent and retried; a record that can't be processed goes to a dead-letter topic.</text>
  <text class="foot" x="75" y="560">Case service → executor (<tspan class="mono">cs.action.requested</tspan>) and the outcome back (<tspan class="mono">cs.outcomes</tspan>) also travel over Redpanda.</text>
</svg>
