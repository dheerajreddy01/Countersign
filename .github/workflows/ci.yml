name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the console image
        run: docker build -t countersign-web ./web
      - name: Run the container
        run: docker run -d --name web -p 3000:3000 countersign-web
      - name: Smoke-test the running container
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/ >/dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:3000/ >/dev/null
          curl -fsS http://localhost:3000/api/cases >/dev/null
          curl -fsS http://localhost:3000/cases/1001 | grep -q "Fight the dispute"
      - name: Container logs on failure
        if: failure()
        run: docker logs web || true
      - name: Teardown
        if: always()
        run: docker rm -f web || true

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: bash -n infra/redpanda/create-topics.sh
