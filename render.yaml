# Render Blueprint for Countersign.
#
# Six services plus a managed Postgres, all in one region so they can reach
# each other over the private network.
#
# The broker runs as a private service with a disk because Render has no
# managed Kafka. That is less alarming than it sounds here: the pipeline only
# ever talks to Redpanda over its HTTP proxy (services/pipeline/internal/bus),
# so nothing needs the Kafka protocol across the network, and Redpanda's only
# Kafka client is its own proxy inside the same container — which is why the
# advertised Kafka address below is 127.0.0.1.
#
# Internal hostnames are assigned at deploy time and carry a generated suffix,
# so every cross-service address comes from `fromService` rather than being
# written out. Blueprints have no string interpolation, which is why the
# services accept a `*_HOSTPORT` variable alongside the full URL form.
#
# Three steps remain after the first apply, all in docs/deploy.md:
#   1. paste the values marked `sync: false` (PayPal credentials, the mandate
#      signing key, the console password, the Groq API key)
#   2. apply the schema with infra/postgres/migrate.sh
#   3. re-register the PayPal webhook at the gateway's new URL

# A generated shared secret the console presents to the case service on the
# money-moving action endpoint, so that endpoint is not callable by anything
# else that can reach it on the private network. Generated once and injected
# into both services, so there is nothing to paste and the two always agree.
envVarGroups:
  - name: countersign-secrets
    envVars:
      - key: INTERNAL_API_TOKEN
        generateValue: true

databases:
  - name: countersign-postgres
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "16"
    databaseName: countersign
    user: countersign

services:
  # --- broker ---------------------------------------------------------------
  # Needs the most memory of anything here. Built from infra/redpanda rather
  # than pulled as a plain image, because the broker has to create the
  # pipeline's topics itself: a Blueprint has no one-off task to do it, and the
  # HTTP proxy that every service talks through never auto-creates a topic on
  # produce (auto_create_topics_enabled notwithstanding). The flags live in that
  # Dockerfile's CMD.
  - type: pserv
    name: countersign-redpanda
    runtime: docker
    region: oregon
    plan: 1c-2g
    dockerfilePath: ./infra/redpanda/Dockerfile
    dockerContext: ./infra/redpanda
    envVars:
      # Redpanda binds five ports (Kafka, the HTTP proxy, the schema registry,
      # admin, RPC), and every other service finds it through `hostport`,
      # which carries one. Naming the proxy's port here is what makes that one
      # the proxy. Each worker logs the address it resolved at startup
      # ("bus: group … subscribed … via http://…:8082") — check that line on
      # the first deploy.
      - key: PORT
        value: "8082"
    # 1 GB, not 5: a Render disk can be grown later but never shrunk, and it
    # keeps billing while the service is suspended, so the first apply is the
    # only chance to pick the small one. Demo volume is a few thousand events.
    disk:
      name: redpanda-data
      mountPath: /var/lib/redpanda/data
      sizeGB: 1

  # --- public: PayPal posts here -------------------------------------------
  # The one service that must be reachable from outside, and the reason to
  # deploy at all: a stable HTTPS URL that does not die with a local tunnel.
  # Free instance type: nothing calls the gateway over the private network, it
  # only receives PayPal's public POSTs, and a free service may still *send*
  # private requests (to the broker). The cost is a 15-minute idle spin-down and
  # a ~1 minute cold start, so the first webhook after a quiet spell can time
  # out — PayPal retries, and `curl /healthz` before a demo wakes it on purpose.
  - type: web
    name: countersign-gateway
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./services/gateway/Dockerfile
    dockerContext: ./services/gateway
    healthCheckPath: /healthz
    envVars:
      # Render routes to the port in $PORT, which is 10000.
      - key: GATEWAY_ADDR
        value: ":10000"
      - key: REDPANDA_PROXY_HOSTPORT
        fromService:
          type: pserv
          name: countersign-redpanda
          property: hostport
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      # Verification is the point of a public endpoint: with this true, anyone
      # who learns the URL can post events into the pipeline.
      - key: GATEWAY_SKIP_SIGNATURE_VERIFY
        value: "false"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  # --- public: the merchant console ----------------------------------------
  # Behind a sign-in page (web/middleware.ts, web/lib/session.ts), because it shows every dispute.
  # /healthz is outside that gate so this health check does not 401.
  # Free: same reasoning as the gateway. A browser waiting a minute for the
  # first page load is a fair trade for a third of the monthly bill.
  - type: web
    name: countersign-console
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /healthz
    envVars:
      - fromGroup: countersign-secrets
      - key: CONSOLE_API_HOSTPORT
        fromService:
          type: pserv
          name: countersign-caseservice
          property: hostport
      - key: CONSOLE_USER
        value: merchant
      - key: CONSOLE_PASSWORD
        sync: false
      # AI_SERVICE_URL is deliberately unset: the console's score endpoint falls
      # back to the TypeScript mirror of the decision rule, which the parity
      # guard keeps in step with the Python service.

  # --- the spine ------------------------------------------------------------
  # The case service and the three pipeline workers (normalizer, evidence
  # builder, executor) share one instance, started by /spine
  # (services/pipeline/cmd/spine). That is a cost decision: as separate
  # services the workers were three more paid instances doing little between
  # disputes. The binaries are unchanged and still run one per container under
  # compose.
  #
  # Spine is all-or-nothing: if any child exits, it stops the rest and exits
  # non-zero, so Render restarts the whole instance rather than leaving a dead
  # worker behind a green health check. Each line in the log is prefixed with
  # the child's name, e.g. "[normalizer] normalised …".
  #
  # The env below is the union of what the four need; none of them reads a
  # variable another sets differently. The workers' health servers bind to
  # loopback (spine's default), and PORT pins 8081 so `hostport`, which the
  # console reads, names the case service API and not a worker's health port.
  #
  # The executor carries out approved actions against the PayPal Disputes API.
  # With the two PAYPAL_* values set, submissions are real; left unset, it
  # simulates every action and labels the outcome. The terminal win/lost/settled
  # ruling is always simulated and labeled: a real sandbox ruling can take days,
  # so the board would otherwise never reach a final state in a demo.
  - type: pserv
    name: countersign-caseservice
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./services/pipeline/Dockerfile
    dockerContext: ./services/pipeline
    dockerCommand: /spine
    envVars:
      - fromGroup: countersign-secrets
      - key: PORT
        value: "8081"
      - key: CASE_SERVICE_ADDR
        value: ":8081"
      - key: DATABASE_URL
        fromDatabase:
          name: countersign-postgres
          property: connectionString
      - key: REDPANDA_PROXY_HOSTPORT
        fromService:
          type: pserv
          name: countersign-redpanda
          property: hostport
      # Evidence builder: scores and drafts through the AI service.
      - key: AI_SERVICE_HOSTPORT
        fromService:
          type: pserv
          name: countersign-ai
          property: hostport
      # Executor.
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: EXECUTOR_SIMULATE_RULING
        value: "true"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

  # The mandate ledger. MANDATE_SIGNING_KEY must be set and must then never
  # change: unset, the service mints a throwaway key per boot and every mandate
  # signed with the previous one stops verifying.
  #
  # A web service rather than a private one, which is the only way a mandate
  # can be recorded against the deployed stack: cmd/demoagent posts to
  # MANDATE_SERVICE_URL from outside Render, a Blueprint has no one-off task to
  # run it from inside, and with this private the mandate signal would always
  # read "absent" in the deployed demo — the one signal docs/deploy.md calls
  # real. The trade is that POST /mandates is then publicly callable, so the
  # ledger accepts records from anyone who finds the URL. Acceptable for a
  # sandbox demo and not beyond it; a real deployment puts this behind the same
  # shared-secret check as the case service action endpoint.
  - type: web
    name: countersign-mandate
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./services/pipeline/Dockerfile
    dockerContext: ./services/pipeline
    dockerCommand: /mandate
    healthCheckPath: /healthz
    envVars:
      # Render routes to the port in $PORT, which is 10000.
      - key: MANDATE_SERVICE_ADDR
        value: ":10000"
      - key: DATABASE_URL
        fromDatabase:
          name: countersign-postgres
          property: connectionString
      - key: MANDATE_SIGNING_KEY
        sync: false

  # Scoring and drafting.
  - type: pserv
    name: countersign-ai
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./services/ai/Dockerfile
    dockerContext: ./services/ai
    envVars:
      - key: PORT
        value: "8000"
      - key: COST_TO_FIGHT_DEFAULT
        value: "25.00"
      # Unset means the fraud signal stays neutral; there is no trained model
      # artifact in the repo to point at.
      - key: FRAUD_MODEL_PATH
        value: ""
      # Unset, POST /draft uses the deterministic template drafter and the
      # grounded-LLM half of the stack is dead on the deployed copy while
      # looking healthy. Set it and the LLM writes the rebuttal, with the
      # grounding guard still gating the result. GROQ_MODEL is left unset: the
      # default in services/ai/app/llm.py is checked against Groq's served
      # list, and an ungrounded or failed draft falls back to the template.
      - key: GROQ_API_KEY
        sync: false
