# https://taskfile.dev — run `task --list` to see everything.
version: "3"

dotenv: [".env"]

tasks:
  default:
    cmds: [task --list]
    silent: true

  setup:
    desc: Create .env from the example if it does not exist
    cmds:
      - cmd: test -f .env || cp .env.example .env
        platforms: [linux, darwin]
      - cmd: if not exist .env copy .env.example .env
        platforms: [windows]

  up:
    desc: Start Postgres, Redpanda, topics, gateway, pipeline, AI service and console
    deps: [setup]
    cmds: [docker compose up --build -d]

  down:
    desc: Stop the stack (keeps volumes)
    cmds: [docker compose down]

  reset:
    desc: Stop the stack and delete volumes (wipes the database)
    cmds: [docker compose down -v]

  warm-up:
    desc: Wake the deployed demo (free Render services) a couple of minutes before showing it
    cmds: [bash scripts/warm-up.sh]

  logs:
    desc: Follow logs, e.g. `task logs -- gateway`
    cmds: ["docker compose logs -f {{.CLI_ARGS}}"]

  topics:
    desc: List Kafka topics
    cmds: [docker compose exec redpanda rpk topic list]

  psql:
    desc: Open a psql shell in the Postgres container
    cmds: ["docker compose exec postgres psql -U ${POSTGRES_USER:-countersign} ${POSTGRES_DB:-countersign}"]

  test:
    desc: Run all tests
    cmds:
      - task: test:gateway
      - task: test:pipeline
      - task: test:ai
      - task: test:web

  test:gateway:
    desc: Go tests for the gateway
    dir: services/gateway
    cmds: [go test ./...]

  test:pipeline:
    desc: Go tests for the event spine and mandate ledger
    dir: services/pipeline
    cmds: [go test ./...]

  test:db:
    desc: (Re)create the throwaway database the integration tests use
    cmds:
      - docker compose exec -T postgres psql -U ${POSTGRES_USER:-countersign} -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS countersign_test'
      - docker compose exec -T postgres psql -U ${POSTGRES_USER:-countersign} -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE countersign_test'
      - docker compose exec -T postgres psql -U ${POSTGRES_USER:-countersign} -d countersign_test -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/001_schema.sql
      - docker compose exec -T postgres psql -U ${POSTGRES_USER:-countersign} -d countersign_test -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/002_pipeline.sql

  test:pipeline:integration:
    desc: Postgres-backed tests for the pipeline store (needs `task up`)
    dir: services/pipeline
    deps: [test:db]
    env:
      # A throwaway database, not the one `task up` serves. These tests clean up
      # with DELETE FROM on every table, so pointing them at `countersign`
      # empties the local board mid-demo.
      TEST_DATABASE_URL: postgres://countersign:countersign@localhost:5432/countersign_test?sslmode=disable
    cmds: [go test -tags integration ./internal/store/]

  test:ai:
    desc: Python tests for the AI service
    dir: services/ai
    cmds: [python -m pytest]

  test:web:
    desc: Guard parity test for the console (TypeScript mirror vs Python)
    dir: web
    cmds: [npm run test:guard]

  lint:
    desc: Static checks
    cmds:
      - task: lint:gateway
      - task: lint:pipeline
      - task: compose:check

  lint:gateway:
    dir: services/gateway
    cmds:
      - go vet ./...
      - 'test -z "$(gofmt -l .)"'

  lint:pipeline:
    dir: services/pipeline
    cmds:
      - go vet ./...
      - 'test -z "$(gofmt -l .)"'

  compose:check:
    desc: Validate docker-compose.yml
    cmds: [docker compose config --quiet]

  sync:
    desc: Merge the latest origin/main into the current branch
    cmds:
      - git fetch origin
      - git merge origin/main

  ruleset:apply:
    desc: Create or update the GitHub ruleset for main (needs gh auth login)
    cmds: [bash scripts/apply-ruleset.sh]

  ci:
    desc: What CI runs
    cmds:
      - task: lint
      - task: test
